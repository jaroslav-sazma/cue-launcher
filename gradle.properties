# 1 GiB of metaspace stopped being enough once KSP, Metro, the Compose plugin and the screenshot
# layoutlib all run in one daemon — the daemon restarted after every build.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8

org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The com.android.compose.screenshot plugin reads this flag while it is being applied, so it has
# to live here — setting it in android { experimentalProperties } is too late.
android.experimental.enableScreenshotTest=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
